name: release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  # HeroesClientSDK comes from GitHub Packages (nuget.config).
  packages: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # GitHub Packages needs a token for a NuGet restore, even for a public package. This
      # changes only the runner's copy of nuget.config.
      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --configfile nuget.config --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
      - name: Build
        run: dotnet build heroes-replay.slnx -c Release --nologo
      - name: Unit tests
        run: dotnet test heroes-replay.slnx -c Release --no-build --nologo -p:TestCategory=Unit
      - name: Smoke tests
        run: dotnet test heroes-replay.slnx -c Release --no-build --nologo -p:TestCategory=Smoke
      - name: Package release zip
        shell: pwsh
        run: pwsh -NoProfile -File tools/package-release.ps1 -OutputPath heroesreplay-win-x64.zip -Version 'v${{ steps.gitversion.outputs.semVer }}' -Configuration Release
      - name: Verify release zip
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-release.ps1 -ZipPath heroesreplay-win-x64.zip -Version 'v${{ steps.gitversion.outputs.semVer }}'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: v${{ steps.gitversion.outputs.semVer }}
          files: heroesreplay-win-x64.zip
          fail_on_unmatched_files: true
