name: release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          # The SDK global.json pins (#462). Dependabot bumps it; package-release.ps1 writes
          # the .NET runtime the packaged exe runs on into runtime.txt.
          global-json-file: global.json
      # HeroesClientSDK restores from .packages (nuget.config): the GitHub Release asset, no
      # credentials, checked against the SHA-256 pinned in Directory.Packages.props.
      - name: Fetch HeroesClientSDK
        shell: pwsh
        run: pwsh -NoProfile -File tools/restore-sdk-package.ps1
      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.x
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
      - name: Build
        run: dotnet build heroes-replay.slnx -c Release --nologo
      - name: Unit tests
        run: dotnet test heroes-replay.slnx -c Release --no-build --nologo -p:TestCategory=Unit
      - name: Smoke tests
        run: dotnet test heroes-replay.slnx -c Release --no-build --nologo -p:TestCategory=Smoke
      - name: Package release zip
        shell: pwsh
        run: pwsh -NoProfile -File tools/package-release.ps1 -OutputPath heroesreplay-win-x64.zip -Version 'v${{ steps.gitversion.outputs.semVer }}' -Configuration Release
      - name: Verify release zip
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-release.ps1 -ZipPath heroesreplay-win-x64.zip -Version 'v${{ steps.gitversion.outputs.semVer }}'
      # The release notes name the .NET runtime the zip's runtime.txt records and the SDK that built
      # it (#462). The runtime-currency workflow reads the "Runtime:" line of the latest release.
      - name: Read the release runtime
        id: runtime
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path heroesreplay-win-x64.zip))
          try {
            $reader = [System.IO.StreamReader]::new($zip.GetEntry('runtime.txt').Open())
            $runtime = $reader.ReadToEnd().Trim()
            $reader.Dispose()
          }
          finally {
            $zip.Dispose()
          }
          "runtime=$runtime" >> $env:GITHUB_OUTPUT
          "sdk=$(dotnet --version)" >> $env:GITHUB_OUTPUT
      # The release tag must point at the master commit this run built (#339). GitHub ignores
      # target_commitish when the tag already exists, so refuse a tag that sits anywhere else.
      - name: Check the release tag
        shell: pwsh
        env:
          TAG: v${{ steps.gitversion.outputs.semVer }}
        run: |
          if (git tag --list $env:TAG) {
            $commit = git rev-list -n 1 $env:TAG
            if ($commit -ne $env:GITHUB_SHA) {
              throw "Tag $env:TAG already points at $commit, not at $env:GITHUB_SHA, the master commit this run built."
            }
          }
      # Without target_commitish, GitHub creates a new tag on the default branch (develop).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.gitversion.outputs.semVer }}
          files: heroesreplay-win-x64.zip
          fail_on_unmatched_files: true
          body: |
            Runtime: ${{ steps.runtime.outputs.runtime }}
            SDK: ${{ steps.runtime.outputs.sdk }}

            Framework-dependent win-x64. The stream PC runs it on its machine-wide .NET runtime, which Microsoft Update services. The runtime above is the one CI built and tested it on (`runtime.txt` in the zip). Patch Tuesday cadence: `docs/runtime-currency.md`.
