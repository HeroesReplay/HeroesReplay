name: ci

# Required check for develop (and master). Same gate as tools/verify.ps1 plus format and smoke tests.
on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # HeroesClientSDK comes from GitHub Packages (nuget.config).
  packages: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      HEROESREPLAY_SKIP_VERIFY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # GitHub Packages needs a token for a NuGet restore, even for a public package. This
      # changes only the runner's copy of nuget.config.
      - name: Authenticate GitHub Packages
        run: dotnet nuget update source github --configfile nuget.config --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
      - name: Restore tools
        run: dotnet tool restore
      - name: Format (CSharpier)
        run: dotnet csharpier check src
      - name: Build
        run: dotnet build heroes-replay.slnx -c Release
      - name: Unit tests
        run: dotnet test heroes-replay.slnx -c Release --no-build -p:TestCategory=Unit
      - name: Smoke tests
        run: dotnet test heroes-replay.slnx -c Release --no-build -p:TestCategory=Smoke
      # The same zip release.yml uploads, built and checked before it can reach master.
      - name: Package release zip
        shell: pwsh
        run: pwsh -NoProfile -File tools/package-release.ps1 -OutputPath "$env:RUNNER_TEMP\heroesreplay-win-x64.zip" -Version "v0.0.0-ci.$env:GITHUB_RUN_NUMBER" -Configuration Release
      - name: Verify release zip
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-release.ps1 -ZipPath "$env:RUNNER_TEMP\heroesreplay-win-x64.zip" -Version "v0.0.0-ci.$env:GITHUB_RUN_NUMBER"
