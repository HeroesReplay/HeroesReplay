# Keeps the .NET SDK, the NuGet packages, and the workflow actions current (#462). Pull requests
# target develop and go through ci like any other change. .NET servicing ships on Patch Tuesday
# (the second Tuesday of the month): merge the SDK and Microsoft.Extensions bumps within 7 days,
# within 72 hours when the .NET release notes list a CVE (docs/runtime-currency.md).
version: 2
updates:
  # global.json. The SDK carries the runtime the release is built and tested on, and the one a
  # self-contained or Native AOT release ships.
  - package-ecosystem: dotnet-sdk
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: wednesday
    labels:
      - dependencies

  # Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: wednesday
    labels:
      - dependencies
    open-pull-requests-limit: 10
    ignore:
      # An exact pin with its SHA-256 beside it (HeroesClientSDKSha256), restored from .packages.
      # A bump is a match-clock change and needs the live proof on ASA-SERVER (AGENTS.md).
      - dependency-name: HeroesClientSDK
      # Stay on the .NET 10 LTS line the runtime runs on, and on System.CommandLine 2.
      - dependency-name: Microsoft.Extensions.*
        update-types:
          - version-update:semver-major
      - dependency-name: System.*
        update-types:
          - version-update:semver-major
    groups:
      # The .NET 10 servicing train: one pull request each Patch Tuesday.
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
          - System.*
        exclude-patterns:
          - System.CommandLine
      opentelemetry:
        patterns:
          - OpenTelemetry*
      kiota:
        patterns:
          - Microsoft.Kiota.*

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels:
      - dependencies
