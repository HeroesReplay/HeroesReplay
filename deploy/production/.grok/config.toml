# Release install copy. The repo's own .grok/config.toml runs `dotnet run`, which
# does not exist in C:\heroesreplay\app.
[mcp_servers.heroesreplay]
command = 'C:\heroesreplay\app\heroesreplay.exe'
args = ["mcp"]
env = { HEROES_REPLAY_ENV = "prod" }
startup_timeout_sec = 60
enabled = true

[mcp_servers.aspire]
command = "aspire"
args = ["agent", "mcp", "--dashboard-url", "http://127.0.0.1:18888"]
startup_timeout_sec = 60
enabled = true
