# Optional Aspire Dashboard for HeroesReplay OpenTelemetry.
# UI:  http://127.0.0.1:18888
# OTLP/gRPC: http://127.0.0.1:4317
# OTLP/HTTP: http://127.0.0.1:4318
#
#   docker compose -f deploy/aspire/docker-compose.yml up -d
#   heroesreplay otel up
#
# Then run the CLI (default OTLP endpoint is already 127.0.0.1:4317):
#   heroesreplay spectate file --file C:\heroesreplay\Replays\example.StormReplay

services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: heroesreplay-aspire-dashboard
    ports:
      - "18888:18888"
      - "4317:18889"
      - "4318:18890"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    restart: unless-stopped
